<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PortfolioWatch</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--bg2:#161b26;--bg3:#1e2535;--bg4:#252d40;
  --border:#2a3347;--border2:#3a4560;
  --text:#e2e8f4;--text2:#8b9bbf;--text3:#556080;
  --green:#3dd68c;--red:#f46e6e;--amber:#f5a623;--blue:#5b9cf6;
  --teal:#38bdf8;--purple:#a78bfa;
  --font:'JetBrains Mono',monospace;
}

html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px}

/* ── Layout ── */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:52px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;gap:12px}
.logo{font-size:16px;font-weight:700;letter-spacing:0.06em;color:var(--teal);white-space:nowrap}
.logo span{color:var(--text2);font-weight:400}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.main{display:flex;flex-direction:column;flex:1;overflow:hidden}
.scroll-area{flex:1;overflow-y:auto}

/* ── Buttons ── */
.btn{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);padding:5px 12px;border-radius:6px;cursor:pointer;font-family:var(--font);font-size:12px;display:inline-flex;align-items:center;gap:6px;transition:all 0.15s;white-space:nowrap}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btn.primary{background:rgba(56,189,248,0.1);border-color:rgba(56,189,248,0.3);color:var(--teal)}
.btn.primary:hover{background:rgba(56,189,248,0.2)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn.spin .icon{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Exchange tabs ── */
.exchange-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;overflow-x:auto}
.etab{padding:11px 22px;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:0.09em;color:var(--text3);border-bottom:2px solid transparent;transition:all 0.15s;white-space:nowrap}
.etab:hover{color:var(--text2)}
.etab.active{color:var(--teal);border-bottom-color:var(--teal)}
.badge{display:inline-block;background:var(--bg3);color:var(--text3);font-size:10px;padding:1px 6px;border-radius:10px;margin-left:6px}
.etab.active .badge{background:rgba(56,189,248,0.15);color:var(--teal)}

/* ── Controls ── */
.controls{display:flex;align-items:center;gap:10px;padding:9px 1.5rem;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.ctrl-label{font-size:10px;color:var(--text3);letter-spacing:0.08em}
select{background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:5px 10px;border-radius:6px;font-family:var(--font);font-size:12px;cursor:pointer;outline:none}
select:focus{border-color:var(--teal)}

/* ── Summary bar ── */
.summary-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--border);flex-shrink:0}
.scard{background:var(--bg2);padding:10px 1.5rem}
.scard .sl{font-size:9px;color:var(--text3);letter-spacing:0.1em;margin-bottom:3px}
.scard .sv{font-size:15px;font-weight:700}
.scard .sc{font-size:11px;margin-top:1px}
.pos{color:var(--green)}.neg{color:var(--red)}.neu{color:var(--text2)}

/* ── Table ── */
.table-wrap{padding:0 1.5rem 2rem;overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:0.75rem;min-width:600px}
th{font-size:10px;letter-spacing:0.08em;color:var(--text3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;user-select:none;cursor:pointer}
th:hover{color:var(--text2)}
th.r,td.r{text-align:right}
td{padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
tr:hover td{background:rgba(255,255,255,0.02)}
.ticker{font-weight:700;color:var(--blue)}
.type-badge{display:inline-block;font-size:9px;padding:2px 6px;border-radius:3px;letter-spacing:0.06em;font-weight:700}
.ETF{background:rgba(167,139,250,0.15);color:var(--purple)}
.MF{background:rgba(56,189,248,0.12);color:var(--teal)}
.Share{background:rgba(245,166,35,0.12);color:var(--amber)}
.empty{padding:3rem 1.5rem;text-align:center;color:var(--text3);font-size:12px;line-height:2}
.del-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:2px 7px;border-radius:4px;transition:all 0.15s;font-family:var(--font)}
.del-btn:hover{color:var(--red);background:rgba(244,110,110,0.1)}
.edit-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;padding:2px 7px;border-radius:4px;transition:all 0.15s;font-family:var(--font)}
.edit-btn:hover{color:var(--amber);background:rgba(245,166,35,0.1)}
.pnl-sub{font-size:10px;margin-top:1px}

/* ── Status dot ── */
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;flex-shrink:0}
.dot-ok{background:var(--green);box-shadow:0 0 5px var(--green)}
.dot-partial{background:var(--amber);animation:pulse 1.2s ease infinite}
.dot-none{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* ── Modal ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;align-items:flex-start;justify-content:center;padding-top:80px}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:1.5rem;width:380px;max-width:95vw;max-height:85vh;overflow-y:auto}
.modal h3{font-size:14px;color:var(--teal);margin-bottom:1.25rem;letter-spacing:0.05em}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:10px;color:var(--text3);margin-bottom:4px;letter-spacing:0.08em}
.form-row input,.form-row select{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:7px 10px;border-radius:6px;font-family:var(--font);font-size:12px;outline:none}
.form-row input:focus,.form-row select:focus{border-color:var(--teal)}
.form-row .hint{font-size:10px;color:var(--text3);margin-top:3px;line-height:1.5}
.form-row .hint code{color:var(--amber)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-btns{display:flex;gap:8px;margin-top:1.25rem;justify-content:flex-end}
.mbtn{padding:6px 18px;border-radius:6px;font-family:var(--font);font-size:12px;cursor:pointer;border:1px solid var(--border2);transition:all 0.15s}
.mbtn.cancel{background:transparent;color:var(--text2)}
.mbtn.cancel:hover{border-color:var(--text2)}
.mbtn.save{background:rgba(56,189,248,0.15);color:var(--teal);border-color:rgba(56,189,248,0.4)}
.mbtn.save:hover{background:rgba(56,189,248,0.25)}

/* ── Toast ── */
#toast{position:fixed;bottom:24px;right:24px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:10px 18px;border-radius:8px;font-size:12px;opacity:0;transform:translateY(10px);transition:all 0.25s;z-index:999;pointer-events:none}
#toast.show{opacity:1;transform:translateY(0)}
#toast.ok{border-color:rgba(61,214,140,0.5);color:var(--green)}
#toast.err{border-color:rgba(244,110,110,0.5);color:var(--red)}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}

/* ── Last updated ── */
.last-updated{font-size:10px;color:var(--text3)}
</style>
</head>
<body>

<div class="app">

  <!-- Top bar -->
  <div class="topbar">
    <div class="logo">PORTFOLIO<span>WATCH</span></div>
    <div class="topbar-right">
      <span class="last-updated" id="lastUpdated"></span>
      <button class="btn" id="refreshBtn" onclick="refreshPrices()">
        <span class="icon">↻</span> Refresh prices
      </button>
      <button class="btn" onclick="exportJSON()">⬇ Export JSON</button>
      <label class="btn" style="cursor:pointer">
        ⬆ Import JSON
        <input type="file" accept=".json" id="importFile" style="display:none" onchange="importJSON(event)">
      </label>
    </div>
  </div>

  <div class="main">
    <!-- Exchange tabs -->
    <div class="exchange-tabs" id="exchangeTabs"></div>

    <!-- Controls -->
    <div class="controls">
      <span class="ctrl-label">VIEW</span>
      <select id="viewSelect" onchange="renderTable()">
        <option value="portfolio">Portfolio</option>
        <option value="watchlist">Watchlist</option>
      </select>
      <span class="ctrl-label">TYPE</span>
      <select id="typeFilter" onchange="renderTable()">
        <option value="all">All types</option>
        <option value="ETF">ETF</option>
        <option value="MF">Mutual Fund</option>
        <option value="Share">Share</option>
      </select>
      <button class="btn primary" style="margin-left:auto" onclick="openModal()">+ Add instrument</button>
    </div>

    <!-- Summary bar -->
    <div class="summary-bar" id="summaryBar"></div>

    <!-- Scroll area -->
    <div class="scroll-area">
      <div class="table-wrap">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div class="empty" id="emptyMsg" style="display:none">
          No instruments found in this view.<br>
          Click <strong>+ Add instrument</strong> to get started,<br>
          or switch view / type filter above.
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Add / Edit Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Add instrument</h3>
    <div class="form-row">
      <label>TICKER SYMBOL</label>
      <input id="fTicker" placeholder="e.g. NIFTYBEES.NS, SPY, EXS1.DE">
      <div class="hint">
        NSE/BSE → suffix <code>.NS</code> or <code>.BO</code> &nbsp;|&nbsp;
        DAX → suffix <code>.DE</code> &nbsp;|&nbsp;
        NYSE/NASDAQ → no suffix
      </div>
    </div>
    <div class="form-row">
      <label>NAME / DESCRIPTION</label>
      <input id="fName" placeholder="e.g. Nippon India Nifty ETF">
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>TYPE</label>
        <select id="fType">
          <option value="ETF">ETF</option>
          <option value="MF">Mutual Fund</option>
          <option value="Share">Share</option>
        </select>
      </div>
      <div class="form-row">
        <label>VIEW</label>
        <select id="fView">
          <option value="portfolio">Portfolio</option>
          <option value="watchlist">Watchlist</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <label>EXCHANGE</label>
      <select id="fExchange"></select>
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>QUANTITY / UNITS</label>
        <input id="fQty" type="number" min="0" step="any" placeholder="100">
      </div>
      <div class="form-row">
        <label>AVG BUY PRICE</label>
        <input id="fBuy" type="number" min="0" step="any" placeholder="0.00">
      </div>
    </div>
    <div class="form-row">
      <label>NOTES (optional)</label>
      <input id="fNotes" placeholder="e.g. SIP, Long term hold...">
    </div>
    <div class="modal-btns">
      <button class="mbtn cancel" onclick="closeModal()">Cancel</button>
      <button class="mbtn save" onclick="saveInstrument()">Save</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════
//  CONFIG — mirrors data/exchanges.json
// ═══════════════════════════════════════════════
const EXCHANGES = [
  {id:'NSE', label:'NSE / BSE', currency:'INR', symbol:'₹', color:'#38bdf8'},
  {id:'DAX', label:'DAX',       currency:'EUR', symbol:'€', color:'#a78bfa'},
  {id:'NYSE',label:'NYSE / NASDAQ', currency:'USD', symbol:'$', color:'#3dd68c'},
];

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
let portfolioData = [];
let livePrices    = {};
let priceChange   = {};
let activeExchange = 'NSE';
let editingId      = null;
let sortKey        = 'ticker';
let sortDir        = 1;
let nextId         = 1;

// ═══════════════════════════════════════════════
//  LOCALSTORAGE
// ═══════════════════════════════════════════════
const LS_KEY = 'portfoliowatch_v2';

function saveToStorage() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      portfolioData,
      livePrices,
      priceChange,
      nextId,
      activeExchange,
      savedAt: new Date().toISOString()
    }));
  } catch(e) { console.warn('Storage save failed', e); }
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    portfolioData  = d.portfolioData  || [];
    livePrices     = d.livePrices     || {};
    priceChange    = d.priceChange    || {};
    nextId         = d.nextId         || (portfolioData.length + 1);
    activeExchange = d.activeExchange || 'NSE';
    if (d.savedAt) {
      document.getElementById('lastUpdated').textContent =
        'Last saved: ' + new Date(d.savedAt).toLocaleString();
    }
    return true;
  } catch(e) { return false; }
}

// ═══════════════════════════════════════════════
//  SEED DATA — loads only if localStorage empty
// ═══════════════════════════════════════════════
function loadSeedData() {
  portfolioData = [
    {id:1,ticker:'NIFTYBEES.NS',name:'Nippon Nifty BeES ETF',type:'ETF',qty:200,buyPrice:220,exchange:'NSE',view:'portfolio',notes:''},
    {id:2,ticker:'JUNIORBEES.NS',name:'Nippon Junior BeES ETF',type:'ETF',qty:100,buyPrice:580,exchange:'NSE',view:'portfolio',notes:'SIP monthly'},
    {id:3,ticker:'HDFCBANK.NS',name:'HDFC Bank Ltd',type:'Share',qty:15,buyPrice:1550,exchange:'NSE',view:'portfolio',notes:''},
    {id:4,ticker:'RELIANCE.NS',name:'Reliance Industries',type:'Share',qty:10,buyPrice:2800,exchange:'NSE',view:'watchlist',notes:'Watching for dip'},
    {id:5,ticker:'EXS1.DE',name:'iShares Core DAX UCITS ETF',type:'ETF',qty:20,buyPrice:135,exchange:'DAX',view:'portfolio',notes:''},
    {id:6,ticker:'VUSA.DE',name:'Vanguard S&P 500 UCITS ETF',type:'ETF',qty:15,buyPrice:95,exchange:'DAX',view:'portfolio',notes:''},
    {id:7,ticker:'SPY',name:'SPDR S&P 500 ETF Trust',type:'ETF',qty:5,buyPrice:420,exchange:'NYSE',view:'portfolio',notes:'Core holding'},
    {id:8,ticker:'QQQ',name:'Invesco QQQ Trust',type:'ETF',qty:3,buyPrice:350,exchange:'NYSE',view:'portfolio',notes:''},
    {id:9,ticker:'AAPL',name:'Apple Inc.',type:'Share',qty:8,buyPrice:175,exchange:'NYSE',view:'watchlist',notes:''},
  ];
  nextId = 10;
  saveToStorage();
}

// ═══════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════
function getEx(id) { return EXCHANGES.find(e => e.id === id) || EXCHANGES[0]; }

function fmt(n) {
  if (Math.abs(n) >= 1e7) return (n/1e7).toFixed(2) + ' Cr';
  if (Math.abs(n) >= 1e5) return (n/1e5).toFixed(2) + ' L';
  if (Math.abs(n) >= 1e3) return n.toLocaleString('en-IN', {maximumFractionDigits:2});
  return n.toFixed(2);
}
function fmtP(n) {
  return n >= 1000 ? n.toLocaleString('en-IN', {maximumFractionDigits:2}) : n.toFixed(2);
}

function toast(msg, type='ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = ''; }, 3000);
}

// ═══════════════════════════════════════════════
//  RENDER TABS
// ═══════════════════════════════════════════════
function renderTabs() {
  document.getElementById('exchangeTabs').innerHTML = EXCHANGES.map(ex => {
    const count = portfolioData.filter(i => i.exchange === ex.id).length;
    return `<div class="etab${ex.id === activeExchange ? ' active' : ''}"
      onclick="switchExchange('${ex.id}')"
      style="${ex.id === activeExchange ? 'color:' + ex.color + ';border-bottom-color:' + ex.color : ''}">
      ${ex.label}<span class="badge">${count}</span>
    </div>`;
  }).join('');
}

function switchExchange(id) {
  activeExchange = id;
  saveToStorage();
  renderTabs();
  renderTable();
}

// ═══════════════════════════════════════════════
//  SUMMARY BAR
// ═══════════════════════════════════════════════
function renderSummary() {
  const view  = document.getElementById('viewSelect').value;
  const items = portfolioData.filter(i => i.exchange === activeExchange && i.view === view);
  const ex    = getEx(activeExchange);
  const sym   = ex.symbol;

  let totalCost = 0, totalVal = 0, withPrices = 0;
  items.forEach(i => {
    totalCost += i.qty * i.buyPrice;
    if (livePrices[i.ticker] != null) {
      totalVal += i.qty * livePrices[i.ticker];
      withPrices++;
    }
  });
  const hasPrices = withPrices > 0;
  const pnl = totalVal - totalCost;
  const pnlPct = totalCost > 0 ? pnl / totalCost * 100 : 0;

  const dotClass = items.length === 0 ? 'dot-none'
    : withPrices === items.length ? 'dot-ok'
    : withPrices > 0             ? 'dot-partial'
    : 'dot-none';

  document.getElementById('summaryBar').innerHTML = `
    <div class="scard"><div class="sl">INSTRUMENTS</div><div class="sv neu">${items.length}</div></div>
    <div class="scard"><div class="sl">INVESTED</div><div class="sv neu">${sym}${fmt(totalCost)}</div></div>
    <div class="scard">
      <div class="sl">CURRENT VALUE</div>
      <div class="sv ${hasPrices ? (pnl >= 0 ? 'pos' : 'neg') : 'neu'}">${hasPrices ? sym + fmt(totalVal) : '—'}</div>
    </div>
    <div class="scard">
      <div class="sl">TOTAL P&L</div>
      <div class="sv ${hasPrices ? (pnl >= 0 ? 'pos' : 'neg') : 'neu'}">${hasPrices ? (pnl >= 0 ? '+' : '') + sym + fmt(Math.abs(pnl)) : '—'}</div>
      <div class="sc ${hasPrices ? (pnl >= 0 ? 'pos' : 'neg') : 'neu'}">${hasPrices ? (pnlPct >= 0 ? '+' : '') + pnlPct.toFixed(2) + '%' : ''}</div>
    </div>
    <div class="scard">
      <div class="sl">PRICE STATUS</div>
      <div class="sv" style="display:flex;align-items:center;font-size:13px">
        <span class="dot ${dotClass}"></span>
        <span class="neu">${withPrices}/${items.length} loaded</span>
      </div>
    </div>
    <div class="scard"><div class="sl">EXCHANGE</div><div class="sv" style="color:${ex.color}">${ex.currency}</div></div>
  `;
}

// ═══════════════════════════════════════════════
//  MAIN TABLE
// ═══════════════════════════════════════════════
function getFilteredItems() {
  const view = document.getElementById('viewSelect').value;
  const type = document.getElementById('typeFilter').value;
  let items  = portfolioData.filter(i =>
    i.exchange === activeExchange &&
    i.view     === view &&
    (type === 'all' || i.type === type)
  );
  items.sort((a, b) => {
    let av = a[sortKey] ?? '', bv = b[sortKey] ?? '';
    if (sortKey === 'pnl' || sortKey === 'pnlPct' || sortKey === 'currentVal') {
      av = computeSort(a, sortKey);
      bv = computeSort(b, sortKey);
    }
    return av < bv ? -sortDir : av > bv ? sortDir : 0;
  });
  return items;
}

function computeSort(item, key) {
  const lp = livePrices[item.ticker];
  if (lp == null) return -Infinity;
  if (key === 'currentVal') return item.qty * lp;
  if (key === 'pnl')        return item.qty * lp - item.qty * item.buyPrice;
  if (key === 'pnlPct') {
    const cost = item.qty * item.buyPrice;
    return cost > 0 ? (item.qty * lp - cost) / cost * 100 : 0;
  }
  return 0;
}

function setSort(key) {
  if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
  renderTable();
}

function arrow(key) {
  if (sortKey !== key) return '<span style="color:var(--text3);font-size:9px"> ⇅</span>';
  return sortDir === 1
    ? '<span style="color:var(--teal);font-size:9px"> ↑</span>'
    : '<span style="color:var(--teal);font-size:9px"> ↓</span>';
}

function renderTable() {
  renderSummary();
  const isPortfolio = document.getElementById('viewSelect').value === 'portfolio';
  const ex  = getEx(activeExchange);
  const sym = ex.symbol;
  const items = getFilteredItems();
  const body  = document.getElementById('tableBody');
  const empty = document.getElementById('emptyMsg');

  document.getElementById('tableHead').innerHTML = `<tr>
    <th onclick="setSort('ticker')">TICKER${arrow('ticker')}</th>
    <th onclick="setSort('name')">NAME${arrow('name')}</th>
    <th>TYPE</th>
    ${isPortfolio ? `<th class="r" onclick="setSort('qty')">QTY${arrow('qty')}</th>` : ''}
    ${isPortfolio ? `<th class="r" onclick="setSort('buyPrice')">AVG COST${arrow('buyPrice')}</th>` : ''}
    <th class="r">LTP</th>
    ${isPortfolio ? `<th class="r" onclick="setSort('currentVal')">VALUE${arrow('currentVal')}</th>` : ''}
    ${isPortfolio ? `<th class="r" onclick="setSort('pnl')">P&L${arrow('pnl')}</th>` : ''}
    <th class="r">CHG%</th>
    <th></th>
  </tr>`;

  if (items.length === 0) { body.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  body.innerHTML = items.map(item => {
    const lp  = livePrices[item.ticker];
    const chg = priceChange[item.ticker];
    const cost = item.qty * item.buyPrice;
    const val  = lp != null ? item.qty * lp : null;
    const pnl  = val != null ? val - cost : null;
    const pnlPct = pnl != null && cost > 0 ? pnl / cost * 100 : null;

    const ltpCell = lp != null
      ? `${sym}${fmtP(lp)}`
      : `<span style="color:var(--text3)">—</span>`;

    const valCell = isPortfolio
      ? `<td class="r">${val != null ? sym + fmt(val) : '—'}</td>` : '';

    const pnlCell = isPortfolio ? (pnl != null
      ? `<td class="r">
          <span class="${pnl >= 0 ? 'pos' : 'neg'}">${pnl >= 0 ? '+' : ''}${sym}${fmt(Math.abs(pnl))}</span>
          <div class="pnl-sub ${pnl >= 0 ? 'pos' : 'neg'}">${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(2)}%</div>
         </td>`
      : `<td class="r" style="color:var(--text3)">—</td>`) : '';

    const chgCell = chg != null
      ? `<span class="${chg >= 0 ? 'pos' : 'neg'}">${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%</span>`
      : `<span style="color:var(--text3)">—</span>`;

    return `<tr>
      <td><span class="ticker">${item.ticker}</span></td>
      <td style="color:var(--text2);max-width:170px;overflow:hidden;text-overflow:ellipsis" title="${item.notes || ''}">${item.name}</td>
      <td><span class="type-badge ${item.type}">${item.type}</span></td>
      ${isPortfolio ? `<td class="r">${item.qty.toLocaleString()}</td>` : ''}
      ${isPortfolio ? `<td class="r">${sym}${fmtP(item.buyPrice)}</td>` : ''}
      <td class="r">${ltpCell}</td>
      ${valCell}
      ${pnlCell}
      <td class="r">${chgCell}</td>
      <td style="white-space:nowrap">
        <button class="edit-btn" onclick="openModal(${item.id})" title="Edit">✎</button>
        <button class="del-btn"  onclick="deleteItem(${item.id})" title="Delete">✕</button>
      </td>
    </tr>`;
  }).join('');
}

// ═══════════════════════════════════════════════
//  PRICE FETCHING
// ═══════════════════════════════════════════════
const PROXY = 'https://api.allorigins.win/get?url=';

async function fetchPrice(ticker) {
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=2d`;
  try {
    const r  = await fetch(PROXY + encodeURIComponent(url));
    const j  = await r.json();
    const d  = JSON.parse(j.contents);
    const meta = d.chart.result[0].meta;
    const lp   = meta.regularMarketPrice || meta.previousClose;
    const prev = meta.chartPreviousClose  || meta.previousClose;
    livePrices[ticker]  = lp;
    priceChange[ticker] = prev ? (lp - prev) / prev * 100 : 0;
  } catch(e) {
    console.warn('Price fetch failed:', ticker, e.message);
  }
}

async function refreshPrices() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spin');
  btn.querySelector('.icon').textContent = '↻';
  const tickers = [...new Set(portfolioData.map(i => i.ticker))];
  await Promise.all(tickers.map(t => fetchPrice(t)));
  saveToStorage();
  renderTabs();
  renderTable();
  btn.classList.remove('spin');
  const now = new Date().toLocaleString();
  document.getElementById('lastUpdated').textContent = 'Updated: ' + now;
  toast('Prices refreshed ✓');
}

// ═══════════════════════════════════════════════
//  ADD / EDIT MODAL
// ═══════════════════════════════════════════════
function populateExchangeDropdown() {
  document.getElementById('fExchange').innerHTML =
    EXCHANGES.map(e => `<option value="${e.id}">${e.label} (${e.currency})</option>`).join('');
}

function openModal(id = null) {
  populateExchangeDropdown();
  editingId = id;
  if (id) {
    const item = portfolioData.find(i => i.id === id);
    document.getElementById('modalTitle').textContent = 'Edit instrument';
    document.getElementById('fTicker').value   = item.ticker;
    document.getElementById('fName').value     = item.name;
    document.getElementById('fType').value     = item.type;
    document.getElementById('fView').value     = item.view;
    document.getElementById('fExchange').value = item.exchange;
    document.getElementById('fQty').value      = item.qty;
    document.getElementById('fBuy').value      = item.buyPrice;
    document.getElementById('fNotes').value    = item.notes || '';
  } else {
    document.getElementById('modalTitle').textContent = 'Add instrument';
    document.getElementById('fTicker').value   = '';
    document.getElementById('fName').value     = '';
    document.getElementById('fType').value     = 'ETF';
    document.getElementById('fView').value     = document.getElementById('viewSelect').value;
    document.getElementById('fExchange').value = activeExchange;
    document.getElementById('fQty').value      = '';
    document.getElementById('fBuy').value      = '';
    document.getElementById('fNotes').value    = '';
  }
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('fTicker').focus();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingId = null;
}

function saveInstrument() {
  const ticker   = document.getElementById('fTicker').value.trim().toUpperCase();
  const name     = document.getElementById('fName').value.trim();
  const type     = document.getElementById('fType').value;
  const view     = document.getElementById('fView').value;
  const exchange = document.getElementById('fExchange').value;
  const qty      = parseFloat(document.getElementById('fQty').value) || 0;
  const buyPrice = parseFloat(document.getElementById('fBuy').value) || 0;
  const notes    = document.getElementById('fNotes').value.trim();

  if (!ticker || !name) { toast('Ticker and name are required', 'err'); return; }

  if (editingId) {
    const idx = portfolioData.findIndex(i => i.id === editingId);
    portfolioData[idx] = { ...portfolioData[idx], ticker, name, type, view, exchange, qty, buyPrice, notes };
    toast('Instrument updated ✓');
  } else {
    portfolioData.push({ id: nextId++, ticker, name, type, view, exchange, qty, buyPrice, notes });
    fetchPrice(ticker).then(() => { saveToStorage(); renderTable(); });
    toast('Instrument added ✓');
  }
  closeModal();
  saveToStorage();
  renderTabs();
  renderTable();
}

function deleteItem(id) {
  const item = portfolioData.find(i => i.id === id);
  if (!confirm(`Delete "${item?.name || id}"?`)) return;
  portfolioData = portfolioData.filter(i => i.id !== id);
  saveToStorage();
  renderTabs();
  renderTable();
  toast('Deleted');
}

// ═══════════════════════════════════════════════
//  IMPORT / EXPORT
// ═══════════════════════════════════════════════
function exportJSON() {
  const data = JSON.stringify(portfolioData, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'portfolio.json';
  a.click();
  toast('portfolio.json downloaded ✓');
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!Array.isArray(imported)) throw new Error('Expected an array');
      portfolioData = imported;
      nextId = Math.max(...imported.map(i => i.id || 0), 0) + 1;
      saveToStorage();
      renderTabs();
      renderTable();
      refreshPrices();
      toast(`Imported ${imported.length} instruments ✓`);
    } catch(err) {
      toast('Import failed: invalid JSON', 'err');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ═══════════════════════════════════════════════
//  KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'n' && !e.target.matches('input,select,textarea')) openModal();
  if (e.key === 'r' && !e.target.matches('input,select,textarea')) refreshPrices();
});

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

// ═══════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════
(function init() {
  const hadData = loadFromStorage();
  if (!hadData) loadSeedData();
  renderTabs();
  renderTable();
  refreshPrices();
})();
</script>
